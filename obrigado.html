<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, follow">
    <title>Mensagem enviada | Euro Truck</title>
    <style>
      :root {
        --color-bg: #868b89;
        --color-surface: #f4f1e8;
        --color-ink: #1c1c1c;
        --color-muted: #2b2c2b;
        --color-line: rgba(0, 0, 0, 0.14);
        --color-primary: #ffc400;
        --font-base: "Arial Black", "Arial Narrow", Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: var(--font-base);
        background: var(--color-bg);
        color: var(--color-ink);
        text-align: center;
      }

      .box {
        max-width: 560px;
      }

      .icon {
        margin: 0 auto 12px;
        width: 64px;
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        background: var(--color-primary);
        color: #090909;
        font-size: 2rem;
        font-weight: 700;
      }

      h1 {
        margin: 12px 0 0;
        color: var(--color-primary);
        font-size: clamp(1.4rem, 4vw, 2rem);
        font-weight: 700;
        text-transform: uppercase;
      }

      p {
        margin: 16px 0 28px;
        color: var(--color-muted);
        font-family: Arial, Helvetica, sans-serif;
        font-weight: 400;
        font-size: 1rem;
        line-height: 1.6;
      }

      a.button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 12px 22px;
        border-radius: 6px;
        background: var(--color-primary);
        color: #090909;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.02em;
        text-decoration: none;
      }

      a.button:hover {
        background: #ffd84c;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <p class="icon" aria-hidden="true">&check;</p>
      <h1>Mensagem enviada!</h1>
      <p>Obrigado pelo contato. Nossa equipe vai analisar sua mensagem e retornar em até 3 dias úteis.</p>
      <a class="button" href="/">Voltar ao início</a>
    </div>
  </body>
</html>
